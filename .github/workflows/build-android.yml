name: Build Android app
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Copy latest app page into the Android app
        run: cp web/index.html android/app/src/main/assets/index.html
      - name: Restore signing key
        env: { KS: '${{ secrets.KEYSTORE_BASE64 }}' }
        run: |
          if [ -z "$KS" ]; then echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets (Settings > Secrets and variables > Actions), then run this workflow again."; exit 1; fi
          echo "$KS" | base64 -d > android/app/release.jks
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease
      - name: Publish APK as a release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk VocabQuiz.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VocabQuiz.apk --title "Vocab Quiz (build ${{ github.run_number }})" --notes "Download VocabQuiz.apk on your Android phone and open it to install."
