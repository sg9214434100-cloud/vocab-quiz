name: Build Android app
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write, issues: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Copy latest app page into the Android app
        run: cp web/index.html android/app/src/main/assets/index.html
      - name: Restore signing key
        env:
          KS: '${{ secrets.KEYSTORE_BASE64 }}'
          PW: '${{ secrets.KEYSTORE_PASSWORD }}'
        shell: bash
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets, then run this workflow again."; exit 1; fi
          clean() { printf '%s' "$1" | sed -E 's/^[[:space:]]*(Value[^:]*:)?[[:space:]]*//' | tr -d '[:space:]'; }
          KSC=$(clean "$KS"); PWC=$(clean "$PW")
          printf '%s' "$KSC" | base64 -d > android/app/release.jks || true
          GOOD=""
          for c in "$PWC" "${PWC:0:${#PWC}-1}" "${PWC:1}" "$(printf '%s' "$PWC" | tr -d '"'"'"'\\`.,;')"; do
            if [ -n "$c" ] && keytool -list -keystore android/app/release.jks -storepass "$c" >/dev/null 2>&1; then GOOD="$c"; break; fi
          done
          [ -n "$GOOD" ] || { echo "::error::The KEYSTORE_PASSWORD secret does not open the signing key."; GOOD="$PWC"; }
          echo "::add-mask::$GOOD"; echo "KEYSTORE_PASSWORD=$GOOD" >> "$GITHUB_ENV"; PWC="$GOOD"
          echo "keystore_base64_chars=${#KSC} (expected 3432) keystore_bytes=$(stat -c%s android/app/release.jks) (expected 2574) password_chars=${#PWC} (expected 24)" | tee secrets-check.txt
      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Publish APK as a release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk VocabQuiz.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VocabQuiz.apk --title "Vocab Quiz (build ${{ github.run_number }})" --notes "Download VocabQuiz.apk on your Android phone and open it to install."
      - name: Report build error
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          [ -f build.log ] || echo "No build log (failed before the build step)" > build.log
          { cat secrets-check.txt 2>/dev/null; echo '```'; grep -nE "FAILURE|What went wrong|error:|Error|Exception|Could not|> " build.log | head -80; echo '---- last lines ----'; tail -60 build.log; echo '```'; } > report.md
          gh issue create --title "Android build ${{ github.run_number }} failed" --body-file report.md
