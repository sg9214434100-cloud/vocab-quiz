plugins { id 'com.android.application' }
android {
    namespace 'com.vocabquiz.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.vocabquiz.app"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1.0." + (System.getenv("VERSION_CODE") ?: "1")
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "vocabquiz"
            keyPassword System.getenv("KEYSTORE_PASSWORD")
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    lint { abortOnError false; checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
